name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # preview cards are only redrawn for new or changed terms; bump CARD_VERSION in term_pages.py after a design change
      - uses: actions/cache@v4
        with:
          path: .cache/og
          key: og-cards-${{ hashFiles('data/terms.csv') }}
          restore-keys: og-cards-
      - run: uv run scripts/build_graph.py
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEZETA }}
          channelId: live
          projectId: tezeta
