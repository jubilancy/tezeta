name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # preview cards are only redrawn for new or changed terms; bump CARD_VERSION in term_pages.py after a design change
      - uses: actions/cache@v4
        with:
          path: .cache/og
          key: og-cards-${{ hashFiles('data/terms.csv') }}
          restore-keys: og-cards-
      - run: uv run scripts/build_graph.py
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEZETA }}
          projectId: tezeta
